# bindings

# recharger la config avec prefix + r
bind r source-file ~/.config/tmux/.tmux.conf \; display-message "tmux.conf reloaded"
unbind %
bind m split-window -h
unbind '"' 
bind h split-window -v

# Redimensionnement : la flèche désigne la bordure du pane courant à déplacer
# prefix + Alt+flèche   : agrandir le pane de ce côté
bind -r M-Left  if -F '#{?pane_at_left,0,1}'   'resize-pane -t "{left-of}" -L 5'
bind -r M-Right if -F '#{?pane_at_right,0,1}'  'resize-pane -R 5'
bind -r M-Up    if -F '#{?pane_at_top,0,1}'    'resize-pane -t "{up-of}" -U 5'
bind -r M-Down  if -F '#{?pane_at_bottom,0,1}' 'resize-pane -D 5'
# prefix + Ctrl+flèche  : rétrécir le pane de ce côté (Cmd+flèche dans WezTerm, cf. wezterm.lua)
bind -r C-Left  if -F '#{?pane_at_left,0,1}'   'resize-pane -t "{left-of}" -R 5'
bind -r C-Right if -F '#{?pane_at_right,0,1}'  'resize-pane -L 5'
bind -r C-Up    if -F '#{?pane_at_top,0,1}'    'resize-pane -t "{up-of}" -D 5'
bind -r C-Down  if -F '#{?pane_at_bottom,0,1}' 'resize-pane -U 5'
# Fix Colors
set-option -a terminal-features 'xterm-256color:RGB'
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# key mode
setw -g mode-keys vi

# copy mode: sélection à la vim (v pour démarrer, C-v pour le mode bloc)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# index start at 1
set -g base-index 1
# renumber window when window is closed 
set -g renumber-windows on  
# # Style des fenêtres (active/inactive)
set -g window-status-style "bg=default,fg=#bac2de"
set -g window-status-current-style "bg=#313244,fg=#a6e3a1,bold"

# List of plugins
 set -g @tpm_plugins '          \
   tmux-plugins/tpm             \
   tmux-plugins/tmux-resurrect  \
   tmux-plugins/tmux-continuum  \
   christoomey/vim-tmux-navigator\
   sainnhe/tmux-fzf\
 '

set -g @vim_navigator_mapping_left "C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"

set -g @continuum-restore 'on'
# initialize tmux plugin manager

set-option -g status-position top
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Afficher index + nom de fenêtre
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Bordures des panes : traits épais, pane active en vert (après catppuccin pour ne pas être écrasé)
set -g pane-border-lines heavy
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#50fa7b,bold"
set -g pane-border-indicators colour

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

run '~/.tmux/plugins/tpm/tpm'
